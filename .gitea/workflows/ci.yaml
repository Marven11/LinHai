name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: debian-latest
    env:
      UV_INDEX_URL: https://repo.huaweicloud.com/repository/pypi/simple
      PIP_INDEX_URL: https://repo.huaweicloud.com/repository/pypi/simple
    steps:
      - name: Configure Chinese mirrors
        run: |
          sed -i 's|deb.debian.org|mirrors.huaweicloud.com|g; s|security.debian.org|mirrors.huaweicloud.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources 2>/dev/null || true
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR is empty
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking if PR has any changes..."
          bash .gitea/scripts/check_empty_pr.sh

      - name: Check PR body length
        run: |
          python3 .gitea/scripts/check_pr_body.py

      - name: Check if branch is behind main
        run: |
          echo "Checking if branch is behind main..."
          bash .gitea/scripts/check_branch_behind.sh

      - name: Setup Python
        run: |
          apt-get update
          apt-get install -y python3 python3-pip python3-venv curl tmux
          pip3 install uv
          uv --version

      - name: Install dependencies
        run: |
          for i in 1 2 3; do uv sync --extra dev && break || sleep 15; done

      - name: Create config file for tests
        run: |
          mkdir -p /root/.config/linhai/
          cat > /root/.config/linhai/config.toml << 'EOF'
          [[llm]]
          name = "deepseek"
          base_url = "http://192.168.114.149:8124/v1"
          api_key = "gomodel-master-key"
          model = "deepseek/deepseek-v4-flash"
          [memory]
          file_path = "./AGENTS.md"
          [[agent]]
          compress_threshold = 0.8
          [tools]
          max_toolcall_token_in_round = 30000
          EOF

      - name: Check PR references issue
        run: |
          echo "Checking if PR references an issue and has no competing PRs..."
          python3 .gitea/scripts/check_pr_issue.py

      - name: Check PR for missing tests (issue 46)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking if PR modifies linhai/ without adding tests..."
          bash .gitea/scripts/check_pr_tests.sh

      - name: Run unittests
        env:
          PYTHONPATH: $PWD
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Running unittest discover -s . -p 'test_*.py'"
          uv run python -m unittest discover -s . -p 'test_*.py' 2> >(tee /tmp/unittest_stderr.txt)

      - name: Run pyright
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pyright linhai/

      - name: Run black
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # 检查PR中修改的Python文件，避免没有文件时black崩溃
          # 使用git diff比较当前分支和主分支，而不是仅检查未提交的更改
          changed_py_files=$(git diff --name-only --diff-filter=d origin/main..HEAD | grep '\.py$' || true)

          if [ -n "$changed_py_files" ]; then
            echo "Running black check on changed Python files:"
            echo "$changed_py_files"
            # 一次性检查所有修改的Python文件
            uv run black --check $changed_py_files
          else
            echo "No Python files changed in this PR, skipping black check"
          fi

      - name: Check for unittest warnings
        run: |
          if grep -P ' [A-Za-z0-9_]+Warning' /tmp/unittest_stderr.txt; then
            echo "Warnings found in unittest stderr, please fix it"
            exit 1
          fi

      - name: Check for RuntimeError in unittest output (issue #686)
        run: |
          if grep -P 'RuntimeError.*cancel scope.*different task' /tmp/unittest_stderr.txt; then
            echo "RuntimeError from exit stack found in unittest output, please fix it"
            exit 1
          fi

      - name: Check for cast function calls (issue 457)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking for cast/typing.cast function calls in Python files..."
          uv run python .gitea/scripts/check_cast_usage.py

      - name: Check for asyncio.create_task usage (issue 508)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking for asyncio.create_task usage in Python files..."
          uv run python .gitea/scripts/check_create_task_usage.py

      - name: Check for Any/object type annotations (issue #461)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking for Any/object type annotations in function parameters..."
          uv run python .gitea/scripts/check_any_object_type_annotations.py

      - name: Check for None/empty default arguments (issue #1121)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking for None/empty default arguments in function parameters..."
          uv run python .gitea/scripts/check_none_default_args.py

      - name: Check for new Python comments
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking for new # comments in Python files..."
          uv run python .gitea/scripts/check_python_comments.py

      - name: Check for garbage code patterns
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking for garbage code patterns (hasattr/getattr/setattr/try except)..."
          bash .gitea/scripts/check_git_diff.sh

      - name: Check for black overformatting (issue 101)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking if black is overformatting files..."
          uv run python .gitea/scripts/check_black_overformat.py

      - name: Check commit count (issue 51)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking if commit count is reasonable..."
          bash .gitea/scripts/check_commit_count.sh

      - name: Check for emoji in commit messages (issue 99)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking for emoji in commit messages..."
          uv run python .gitea/scripts/check_emoji.py

      - name: Check for emoji in changed code files (issue 33)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking for emoji in changed Python code files..."
          uv run python .gitea/scripts/check_code_emoji.py

      - name: Check for browser MCP snapshot documents (issue 113)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking for browser MCP snapshot documents..."
          uv run python .gitea/scripts/check_snapshot_docs.py


  nix-build:
    needs: [test]
    runs-on: debian-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        run: |
          apt-get update && apt-get install -y curl xz-utils
          for i in $(seq 1 5); do
            curl -L --connect-timeout 30 --max-time 300 https://nixos.org/nix/install -o /tmp/nix-install && break
            echo "Attempt $i failed, retrying in 10s..."
            rm -f /tmp/nix-install
            sleep 10
          done
          [ -f /tmp/nix-install ] || { echo "Failed to download nix installer"; exit 1; }
          sh /tmp/nix-install --daemon --no-channel-add
          echo '/nix/var/nix/profiles/default/bin' >> $GITHUB_PATH
          mkdir -p /etc/nix
          cat >> /etc/nix/nix.conf << 'NIXCONF'
          experimental-features = nix-command flakes
          accept-flake-config = true
          substituters = https://mirrors.tuna.tsinghua.edu.cn/nix-channels/store https://cache.nixos.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          NIXCONF

      - name: Create config file for nix unittests
        run: |
          mkdir -p /root/.config/linhai/
          cat > /root/.config/linhai/config.toml << 'EOF'
          [[llm]]
          name = "deepseek"
          base_url = "http://192.168.114.149:8124/v1"
          api_key = "gomodel-master-key"
          model = "deepseek/deepseek-v4-flash"
          [memory]
          file_path = "./AGENTS.md"
          [[agent]]
          compress_threshold = 0.8
          [tools]
          max_toolcall_token_in_round = 30000
          EOF

      - name: Run unittests in nix develop
        env:
          PYTHONPATH: $PWD
        run: nix develop --command python -m unittest discover -s . -p 'test_*.py'

      - name: Build with Nix
        run: nix build

  e2e-test:
    needs: [test, nix-build]
    runs-on: debian-latest
    env:
      UV_INDEX_URL: https://repo.huaweicloud.com/repository/pypi/simple
      PIP_INDEX_URL: https://repo.huaweicloud.com/repository/pypi/simple
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Chinese mirrors
        run: |
          sed -i 's|deb.debian.org|mirrors.huaweicloud.com|g; s|security.debian.org|mirrors.huaweicloud.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources 2>/dev/null || true

      - name: Setup Python
        run: |
          apt-get update
          apt-get install -y python3 python3-pip python3-venv curl tmux
          pip3 install uv
          uv --version

      - name: Install dependencies
        run: |
          for i in 1 2 3; do uv sync --extra dev && break || sleep 15; done

      - name: Create config file for tests
        run: |
          mkdir -p /root/.config/linhai/
          cat > /root/.config/linhai/config.toml << 'EOF'
          [[llm]]
          name = "deepseek"
          base_url = "http://192.168.114.149:8124/v1"
          api_key = "gomodel-master-key"
          model = "deepseek/deepseek-v4-flash"
          [memory]
          file_path = "./AGENTS.md"
          [[agent]]
          compress_threshold = 0.8
          [tools]
          max_toolcall_token_in_round = 30000
          EOF

      - name: Check e2e for skip patterns
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "Checking e2e tests for skip patterns..."
          uv run python .gitea/scripts/check_e2e_skip.py

      - name: Run e2e tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pytest e2e/ -v
