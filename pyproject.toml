[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linhai"
version = "0.1.0"
description = "AI Agent for software engineering and penetration testing"
authors = [
    {name = "LinHai"},
]
dependencies = [
    "fenjing",
    "openai",
    "httpx",
    "beautifulsoup4",
    "mistune",
    "requests",
    "textual",
    "selenium",
    "mcp",
    "pyte",
    "pydantic",
    "textual-autocomplete",
    "chardet",
    "bashlex",
    "tiktoken",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pylint",
    "black",
    "pyright",
]

[project.scripts]
linhai = "linhai.main:main"
