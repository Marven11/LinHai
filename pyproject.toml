[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "linhai"
version = "0.3.0"
description = "AI Agent for software engineering and penetration testing"
authors = [
    {name = "LinHai"},
]
dependencies = [
    "openai",
    "httpx",
    "beautifulsoup4",
    "mistune",
    "textual",
    "mcp",
    "pyte",
    "pydantic",
    "chardet",
    "bashlex",
    "pillow",
    "tomli-w",
    "ether-ghost>=0.2.5",
    "croniter",
    "python-telegram-bot>=22.7",
    "quickjs-ng",
    "rich",
    "pathspec",
    "websockets",
    "pyyaml",
    "jsonschema",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pylint",
    "black",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "tiktoken",
]

[tool.hatch.build.targets.wheel]
packages = ["linhai"]
artifacts = ["linhai/cl100k_base.tiktoken"]

[project.scripts]
linhai = "linhai.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pyright>=1.1.407",
]
